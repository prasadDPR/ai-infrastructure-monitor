grafana:
  enabled: true
  adminPassword: "Healthcare2026!"
  service:
    type: ClusterIP

prometheus:
  enabled: true
  prometheusSpec:
    retention: 24h
    resources:
      requests:
        memory: 400Mi
        cpu: 200m
      limits:
        memory: 600Mi
        cpu: 500m
    storageSpec: {}

alertmanager:
  enabled: true
  alertmanagerSpec:
    resources:
      requests:
        memory: 100Mi
        cpu: 50m
      limits:
        memory: 200Mi
        cpu: 100m
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ['alertname', 'namespace']
      group_wait: 10s
      group_interval: 10s
      repeat_interval: 1h
      receiver: 'ai-pipeline'
      routes:
        - receiver: 'ai-pipeline'
          matchers:
            - alertname != "Watchdog"
    receivers:
      - name: 'ai-pipeline'
        webhook_configs:
          - url: 'https://kfaxnju4jp6n3uot6w5y7v4hua0toyhx.lambda-url.eu-west-2.on.aws/'
            send_resolved: false
      - name: 'null'
    inhibit_rules:
      - source_matchers:
          - severity="critical"
        target_matchers:
          - severity="warning"
        equal: ['alertname', 'namespace']
        
nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true

prometheusOperator:
  enabled: true